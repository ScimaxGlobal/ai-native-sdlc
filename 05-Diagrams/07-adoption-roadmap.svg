<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Adoption roadmap</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Adoption Roadmap (indicative)</text>
  <text x="500" y="62" text-anchor="middle" font-size="13.5" fill="#6b7280">Each phase builds the guardrails the next phase relies on. Durations vary by organization.</text>
  <line x1="40" y1="420" x2="965" y2="420" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="960" y="444" text-anchor="end" font-size="12.5" fill="#6b7280">time →</text>

  <g font-size="12.5">
    <!-- stair steps -->
    <rect x="40" y="340" width="180" height="80" fill="#e5e7eb"/>
    <rect x="220" y="280" width="180" height="140" fill="#dbeafe"/>
    <rect x="400" y="220" width="180" height="200" fill="#ede9fe"/>
    <rect x="580" y="160" width="180" height="260" fill="#dcfce7"/>
    <rect x="760" y="100" width="190" height="320" fill="#cffafe"/>

    <text x="130" y="362" text-anchor="middle" font-weight="700" font-size="14" fill="#111827">Phase 0</text>
    <text x="130" y="380" text-anchor="middle" fill="#374151">Foundations</text>
    <text x="130" y="398" text-anchor="middle" fill="#374151">weeks 0–4</text>

    <text x="310" y="302" text-anchor="middle" font-weight="700" font-size="14" fill="#1e3a8a">Phase 1</text>
    <text x="310" y="320" text-anchor="middle" fill="#374151">Artifacts &amp; loops</text>
    <text x="310" y="338" text-anchor="middle" fill="#374151">weeks 4–10</text>

    <text x="490" y="242" text-anchor="middle" font-weight="700" font-size="14" fill="#4c1d95">Phase 2</text>
    <text x="490" y="260" text-anchor="middle" fill="#374151">Policy &amp; review</text>
    <text x="490" y="278" text-anchor="middle" fill="#374151">weeks 10–18</text>

    <text x="670" y="182" text-anchor="middle" font-weight="700" font-size="14" fill="#14532d">Phase 3</text>
    <text x="670" y="200" text-anchor="middle" fill="#374151">Evals &amp; CI/CD</text>
    <text x="670" y="218" text-anchor="middle" fill="#374151">weeks 18–26</text>

    <text x="855" y="122" text-anchor="middle" font-weight="700" font-size="14" fill="#164e63">Phase 4</text>
    <text x="855" y="140" text-anchor="middle" fill="#374151">Closed loop</text>
    <text x="855" y="158" text-anchor="middle" fill="#374151">week 26+</text>

    <!-- deliverables -->
    <g fill="#1f2937">
      <text x="52" y="100">• Managed settings baseline</text>
      <text x="52" y="118">• Pilot team + repo</text>
      <text x="52" y="136">• CLAUDE.md via /init</text>
      <text x="52" y="154">• OpenTelemetry on</text>

      <text x="232" y="160">• intent / spec / plan</text>
      <text x="232" y="178">   templates in repo</text>
      <text x="232" y="196">• Plan mode default</text>
      <text x="232" y="214">• One-command verify</text>
      <text x="232" y="232">• Parallel worktrees</text>

      <text x="412" y="100">• First 3 policy skills</text>
      <text x="412" y="118">• Build-time hooks</text>
      <text x="412" y="136">• REVIEW.md + AI review</text>
      <text x="412" y="154">• Approval-gate hooks</text>
      <text x="412" y="172">• Subagents (verifier)</text>
    </g>
    <g fill="#1f2937">
      <text x="592" y="100" font-size="12">• 20–50 task eval suite</text>
      <text x="592" y="118" font-size="12">• Evals gate config PRs</text>
      <text x="592" y="136" font-size="12">• Headless triage in CI</text>
    </g>
    <g fill="#1f2937">
      <text x="770" y="200">• Control bands + tiers</text>
      <text x="770" y="218">• Scheduled security scans</text>
      <text x="770" y="236">• Claude on call</text>
      <text x="770" y="254">• Incident → eval loop</text>
      <text x="770" y="272">• Auto mode for routine</text>
      <text x="770" y="290">   work</text>
    </g>
  </g>
</svg>
