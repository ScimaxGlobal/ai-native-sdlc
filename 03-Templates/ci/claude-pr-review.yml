# ---------------------------------------------------------------------------
# claude-pr-review.yml — bi-directional review with anthropics/claude-code-action (Stage 5)
#
# Place at: .github/workflows/claude-pr-review.yml
# Owner: tech lead (REVIEW.md) + platform engineering (this workflow).
#
# Two jobs:
#   review   — automation mode: on every non-draft PR, Claude reviews the diff
#              against REVIEW.md, CLAUDE.md, and the linked intent/spec/plan,
#              and posts inline comments + one summary comment.
#   respond  — interactive mode: when a reviewer writes "@claude ..." on a PR
#              or issue, Claude acts on it (e.g. fixes and pushes to the PR
#              branch). Every action is recorded in the thread.
#
# Claude's review NEVER approves or blocks. Keep branch protection requiring
# code-owner approval — the PR is the audit record and a human is the gate.
#
# Setup: install the Claude GitHub App (or run /install-github-app) and add
# the ANTHROPIC_API_KEY secret (or CLAUDE_CODE_OAUTH_TOKEN; then swap the input).
# Alternative with no workflow to maintain: the managed Code Review service.
# ---------------------------------------------------------------------------
name: claude-pr-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write     # post review comments
      issues: read
      id-token: write          # GitHub App authentication used by the action
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0       # needed to diff against the base branch

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Base: ${{ github.event.pull_request.base.sha }}  Head: ${{ github.event.pull_request.head.sha }}

            Follow REVIEW.md in the repository root exactly (three tagged passes,
            Important vs Nit, at most 5 nits, skip generated paths and anything CI enforces).
            Also read CLAUDE.md and any work/*/intent.md, spec.md or plan.md files the PR links or changes.
            Apply the secure-api-review skill to any changed endpoint.

            Post each Important finding as an inline comment on the relevant line.
            Then post ONE summary comment with: counts per pass, the Important list,
            nits (max 5, rest as a count), and any finding seen on a previous PR that
            should become a CLAUDE.md line.
            Do not approve or request changes; do not push commits.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment *),Bash(gh pr diff *),Bash(gh pr view *),Bash(git diff *),Bash(git log *),Read,Grep,Glob"

  respond:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # push fixes to the PR branch
      pull-requests: write
      issues: write
      id-token: write
      actions: read            # read CI results when babysitting a PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No `prompt` => interactive mode: Claude acts on the @claude comment.
          # Repo hooks in .claude/settings.json (production gate, protected paths,
          # secrets) apply to these runs too.
          claude_args: "--max-turns 25"
